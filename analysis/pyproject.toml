[project]
name = "crimescope-analysis"
version = "0.1.0"
description = "CrimeScope offline data processing and analytical methods"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
