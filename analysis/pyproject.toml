[project]
name = "crimescope-analysis"
version = "0.1.0"
description = "CrimeScope offline data processing and analytical methods"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
crimescope-build = "crimescope_analysis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
